# Portal Scanner Configuration
# Used by /career-ops scan to discover new offers automatically.
#
# Target: Marketing Manager & Solutions Consultant roles
# Primary: AI companies. Secondary: broader B2B SaaS / tech.

# -- Title filter --
title_filter:
  positive:
    # -- Product Marketing --
    - "Product Marketing"
    - "PMM"
    - "Technical Product Marketing"
    - "AI Product Marketing"
    # -- Growth / Demand Gen --
    - "Growth Marketing"
    - "Demand Generation"
    - "Demand Gen"
    - "Lifecycle Marketing"
    - "Performance Marketing"
    - "Acquisition Marketing"
    - "ABM"
    - "Account-Based Marketing"
    - "Marketing Manager"
    - "Marketing Lead"
    - "Head of Marketing"
    - "Head of Growth"
    - "Director of Marketing"
    - "VP Marketing"
    # -- Brand / Content --
    - "Content Marketing"
    - "Brand Marketing"
    - "Developer Marketing"
    - "Community Marketing"
    # -- Solutions Consulting / Engineering --
    - "Solutions Consultant"
    - "Solution Consultant"
    - "Solutions Engineer"
    - "Solution Engineer"
    - "Sales Engineer"
    - "Pre-Sales Engineer"
    - "Presales Engineer"
    - "Pre-Sales Consultant"
    - "Technical Consultant"
    - "AI Solutions"
    - "AI Solutions Architect"
    - "Forward Deployed"
    - "Deployed Engineer"
    - "Applied AI"
    - "Field Engineer"
    - "Customer Engineer"
    - "Customer Solutions Engineer"
    # -- Post-Sales / Implementation --
    - "Implementation Consultant"
    - "Implementation Engineer"
    - "Technical Account Manager"
    - "Customer Success Engineer"
    - "Professional Services"
  negative:
    # -- Seniority / level out of scope --
    - "Junior"
    - "Intern"
    - "Associate"
    - "Graduate"
    - "Entry Level"
    # -- IC engineering out of scope --
    - "Software Engineer"
    - "Backend Engineer"
    - "Frontend Engineer"
    - "Full Stack Engineer"
    - "Full-Stack Engineer"
    - "Mobile Engineer"
    - "iOS Engineer"
    - "Android Engineer"
    - "Embedded"
    - "Firmware"
    - "Data Engineer"
    - "ML Engineer"
    - "Machine Learning Engineer"
    - "Research Scientist"
    - "Research Engineer"
    - "Data Scientist"
    - "DevOps Engineer"
    - "SRE"
    - "Site Reliability"
    - "Platform Engineer"
    - "Infrastructure Engineer"
    - "Security Engineer"
    - "QA Engineer"
    - "Test Engineer"
    # -- Other noise --
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Recruiter"
    - "Talent Acquisition"
    - "Executive Assistant"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Director"
    - "Manager"

# -- Search queries --
search_queries:
  # -- Ashby --
  - name: Ashby — Product Marketing
    query: 'site:jobs.ashbyhq.com "Product Marketing" OR "PMM" OR "AI Product Marketing" remote'
    enabled: true

  - name: Ashby — Growth / Demand Gen
    query: 'site:jobs.ashbyhq.com "Growth Marketing" OR "Demand Generation" OR "Lifecycle Marketing" remote'
    enabled: true

  - name: Ashby — Solutions Consultant / SE
    query: 'site:jobs.ashbyhq.com "Solutions Consultant" OR "Solutions Engineer" OR "Sales Engineer" OR "Pre-Sales" remote'
    enabled: true

  - name: Ashby — Forward Deployed / Applied AI
    query: 'site:jobs.ashbyhq.com "Forward Deployed" OR "Applied AI" OR "Field Engineer" OR "Customer Engineer" remote'
    enabled: true

  - name: Ashby — Implementation / TAM
    query: 'site:jobs.ashbyhq.com "Implementation Consultant" OR "Technical Account Manager" OR "Customer Success Engineer" remote'
    enabled: true

  # -- Greenhouse --
  - name: Greenhouse — Product Marketing
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Product Marketing" OR "PMM" remote'
    enabled: true

  - name: Greenhouse — Growth / Demand Gen
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Growth Marketing" OR "Demand Generation" remote'
    enabled: true

  - name: Greenhouse — Solutions Consultant / SE
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Solutions Consultant" OR "Solutions Engineer" OR "Sales Engineer" remote'
    enabled: true

  - name: Greenhouse — Forward Deployed / Applied AI
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Forward Deployed" OR "Applied AI" OR "Customer Engineer" remote'
    enabled: true

  # -- Workable --
  - name: Workable — Marketing & SC
    query: 'site:apply.workable.com "Product Marketing" OR "Solutions Consultant" OR "Solutions Engineer" remote'
    enabled: true

  # -- Remote-friendly aggregators --
  - name: Remotive — Marketing & SC
    query: 'site:remotive.com "Product Marketing" OR "Growth Marketing" OR "Solutions Engineer" OR "Solutions Consultant"'
    enabled: true

  - name: WeWorkRemotely — Marketing & SC
    query: 'site:weworkremotely.com "Product Marketing" OR "Solutions Engineer" OR "Sales Engineer" OR "Growth Marketing"'
    enabled: true

  - name: RemoteOK — Marketing & SC
    query: 'site:remoteok.com "Product Marketing" OR "Solutions Engineer" OR "Sales Engineer"'
    enabled: true

  - name: Himalayas — Marketing & SC
    query: 'site:himalayas.app "Product Marketing" OR "Growth Marketing" OR "Solutions Engineer" OR "Solutions Consultant"'
    enabled: true

  # -- AI-specific boards --
  - name: ai-jobs.net — Marketing & SC
    query: 'site:ai-jobs.net "Product Marketing" OR "Solutions Engineer" OR "Solutions Consultant" OR "Forward Deployed"'
    enabled: true

  - name: fwddeploy.com — Forward Deployed
    query: 'site:fwddeploy.com "Forward Deployed" OR "Deployed Engineer"'
    enabled: true

  - name: YC Jobs — Marketing & SC
    query: 'site:workatastartup.com "Product Marketing" OR "Solutions Engineer" OR "Forward Deployed" OR "Growth Marketing"'
    enabled: true

  # -- HN Who's Hiring --
  - name: HN Who's Hiring — Marketing & SC
    query: 'site:news.ycombinator.com OR site:hnrss.org "Product Marketing" OR "Solutions Engineer" OR "Forward Deployed"'
    enabled: true

